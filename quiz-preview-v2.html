<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>RealMeetClub — quiz preview v2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09090a;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#siteFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#09090a}.test-badge{position:fixed;z-index:60;top:max(8px,env(safe-area-inset-top));left:8px;padding:6px 9px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(8,8,9,.85);backdrop-filter:blur(10px);color:#b8b8bd;font-size:10px;font-weight:900;letter-spacing:.08em;pointer-events:none}.overlay{position:fixed;z-index:100;inset:0;display:grid;place-items:center;padding:12px;background:rgba(0,0,0,.72);backdrop-filter:blur(9px);opacity:0;visibility:hidden;transition:.18s}.overlay.open{opacity:1;visibility:visible}.card{position:relative;width:min(460px,100%);max-height:calc(100dvh - 24px);overflow:auto;padding:25px 22px 21px;border:1px solid rgba(255,255,255,.12);border-radius:26px;background:radial-gradient(circle at 50% -15%,rgba(229,9,20,.22),transparent 36%),linear-gradient(155deg,#1a1a1d,#09090a 72%);box-shadow:0 34px 110px rgba(0,0,0,.8);text-align:center}.card:before{content:"";position:absolute;top:0;left:24px;right:24px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,transparent,#e50914,#ff5b65,#e50914,transparent)}.close{position:absolute;top:11px;right:11px;width:34px;height:34px;border:1px solid rgba(255,255,255,.11);border-radius:50%;background:rgba(255,255,255,.055);color:#aaa;font-size:21px;cursor:pointer}.kicker{display:inline-flex;margin-bottom:10px;padding:5px 9px;border:1px solid rgba(229,9,20,.38);border-radius:999px;background:rgba(229,9,20,.1);color:#ff737b;font-size:10px;font-weight:950;letter-spacing:.11em}.progress{display:flex;justify-content:center;gap:6px;margin:0 auto 16px}.progress i{display:block;width:34px;height:4px;border-radius:999px;background:rgba(255,255,255,.1)}.progress i.on{background:#e50914;box-shadow:0 0 12px rgba(229,9,20,.25)}.profile{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px auto 14px}.avatar{position:relative;width:54px;height:54px}.avatar img{display:block;width:54px;height:54px;border-radius:50%;object-fit:cover;object-position:center 24%;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 4px rgba(229,9,20,.1),0 10px 24px rgba(0,0,0,.35)}.avatar b{position:absolute;right:-1px;bottom:0;display:grid;width:19px;height:19px;place-items:center;border:2px solid #111;border-radius:50%;background:#e50914;font-size:10px}.profile-copy{text-align:left}.profile-copy strong{display:block;font-size:15px}.profile-copy span{display:block;margin-top:2px;color:#8f8f95;font-size:11px;font-weight:700}.title{max-width:390px;margin:0 auto 8px;font-size:clamp(1.25rem,5vw,1.62rem);line-height:1.14;letter-spacing:-.025em}.sub{max-width:370px;margin:0 auto 17px;color:#929298;font-size:13px;line-height:1.45}.options{display:grid;gap:9px}.option{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:58px;padding:12px 14px;border:1px solid rgba(255,255,255,.1);border-radius:15px;background:rgba(255,255,255,.045);color:#fff;font:inherit;font-size:14px;font-weight:850;text-align:left;cursor:pointer}.option:hover{border-color:rgba(229,9,20,.48);background:rgba(229,9,20,.08)}.option em{color:#ff5b65;font-size:18px;font-style:normal}.spinner{width:48px;height:48px;margin:5px auto 18px;border:3px solid rgba(255,255,255,.09);border-top-color:#e50914;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.checks{display:grid;gap:7px;width:min(310px,92%);margin:15px auto 0;text-align:left}.checks div{display:flex;gap:8px;align-items:center;color:#8e8e94;font-size:12px}.checks b{display:grid;width:18px;height:18px;place-items:center;border-radius:50%;background:rgba(229,9,20,.12);color:#ff6972;font-size:9px}.result-icon{display:grid;width:58px;height:58px;place-items:center;margin:3px auto 14px;border:1px solid rgba(229,9,20,.35);border-radius:50%;background:rgba(229,9,20,.11);color:#ff6871;font-size:25px;font-weight:1000;box-shadow:0 0 0 8px rgba(229,9,20,.045)}.summary{margin:14px 0 17px;padding:12px 13px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.035);color:#aaaab0;font-size:12px;line-height:1.45}.next{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:15px;background:linear-gradient(180deg,#ef1823,#cf0711);box-shadow:0 10px 30px rgba(229,9,20,.22);color:#fff;font:inherit;font-size:15px;font-weight:950;cursor:pointer}.toast{position:fixed;z-index:140;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,15px);width:min(390px,calc(100vw - 24px));padding:12px 14px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(18,18,20,.97);color:#ddd;font-size:12px;font-weight:750;text-align:center;opacity:0;visibility:hidden;transition:.2s}.toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}
@media(max-width:640px){.overlay{padding:7px}.card{width:100%;max-height:calc(100dvh - 14px);padding:22px 13px 15px;border-radius:22px}.kicker{font-size:9px}.progress{margin-bottom:13px}.profile{margin-bottom:12px}.avatar,.avatar img{width:50px;height:50px}.title{font-size:1.18rem;max-width:350px}.sub{font-size:12px;margin-bottom:14px}.option{min-height:54px;padding:10px 13px;font-size:13px;border-radius:14px}.next{min-height:54px}}
</style>
</head>
<body>
<iframe id="siteFrame" src="/" title="RealMeetClub"></iframe>
<div class="test-badge">TEST · QUIZ V2</div>
<div class="overlay" id="overlay" aria-hidden="true"><section class="card" role="dialog" aria-modal="true"><button class="close" id="close" type="button">×</button><div class="kicker">DOPASOWANIE DO PROFILU</div><div class="progress"><i class="on"></i><i></i><i></i></div><div class="profile"><span class="avatar"><img id="avatar" alt="Anna"><b>✓</b></span><span class="profile-copy"><strong id="profileName">Anna, 41</strong><span>wybrany profil</span></span></div><div id="body"></div></section></div>
<div class="toast" id="toast">TEST: tutaj wybór wieku uruchomi właściwą stronę docelową.</div>
<script>
(()=>{
const frame=document.getElementById('siteFrame'),overlay=document.getElementById('overlay'),body=document.getElementById('body'),avatar=document.getElementById('avatar'),nameEl=document.getElementById('profileName'),close=document.getElementById('close'),toast=document.getElementById('toast'),bars=[...document.querySelectorAll('.progress i')];
let answers=[];let armedWin=null;let toastTimer;
const setStep=n=>bars.forEach((x,i)=>x.classList.toggle('on',i<n));
const syncProfile=doc=>{const title=doc?.querySelector('.hero-invite .featured-profile h2')?.textContent?.trim()||'Anna, 41';nameEl.textContent=title;const img=doc?.querySelector('.hero-invite .featured-profile > img');avatar.src=img?.currentSrc||img?.src||'';avatar.alt=title.split(',')[0]||'Anna'};
const render1=()=>{setStep(1);body.innerHTML='<h2 class="title">Czego teraz szukasz?</h2><p class="sub">Wybierz odpowiedź, która jest Ci najbliższa.</p><div class="options"><button class="option" data-v="Luźnej rozmowy"><span>Luźnej rozmowy</span><em>→</em></button><button class="option" data-v="Flirtu"><span>Flirtu</span><em>→</em></button><button class="option" data-v="Czegoś poważniejszego"><span>Czegoś poważniejszego</span><em>→</em></button></div>';bind(1)};
const render2=()=>{setStep(2);body.innerHTML='<h2 class="title">Co najbardziej przyciąga Cię w kobiecie?</h2><p class="sub">To ostatnie krótkie pytanie przed sprawdzeniem profilu.</p><div class="options"><button class="option" data-v="Ciepło i naturalność"><span>Ciepło i naturalność</span><em>→</em></button><button class="option" data-v="Pewność siebie"><span>Pewność siebie</span><em>→</em></button><button class="option" data-v="Poczucie humoru"><span>Poczucie humoru</span><em>→</em></button></div>';bind(2)};
const bind=step=>body.querySelectorAll('.option').forEach(btn=>btn.onclick=()=>{answers[step-1]=btn.dataset.v;setTimeout(step===1?render2:renderAnalysis,90)});
const renderAnalysis=()=>{setStep(3);body.innerHTML='<div class="spinner"></div><h2 class="title">Sprawdzamy profil Anny…</h2><p class="sub">Porównujemy Twoje odpowiedzi z informacjami w profilu.</p><div class="checks"><div><b>✓</b><span>Profil i opis</span></div><div><b>✓</b><span>Twoje odpowiedzi</span></div><div><b>✓</b><span>Możliwe punkty wspólne</span></div></div>';setTimeout(renderResult,1250)};
const renderResult=()=>{body.innerHTML='<div class="result-icon">✓</div><h2 class="title">Wygląda obiecująco</h2><p class="sub">Na podstawie Twoich odpowiedzi profil Anny jest wart sprawdzenia. Możesz przejść do ostatniego kroku i jej odpowiedzieć.</p><div class="summary">Twoje wybory: '+answers.join(' · ')+'</div><button class="next" id="next" type="button">Przejdź do ostatniego kroku <span>→</span></button>';document.getElementById('next').onclick=openFinal};
const openQuiz=doc=>{answers=[];syncProfile(doc);render1();overlay.classList.add('open');overlay.setAttribute('aria-hidden','false')};
const closeQuiz=()=>{overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true')};
const showToast=()=>{clearTimeout(toastTimer);toast.classList.add('on');toastTimer=setTimeout(()=>toast.classList.remove('on'),2300)};
const openFinal=()=>{closeQuiz();const doc=frame.contentDocument;const modal=doc?.getElementById('ageGateModal');if(modal){try{if(!modal.open)modal.showModal()}catch(_){modal.setAttribute('open','')}}};
const handler=e=>{const t=e.target instanceof Element?e.target:null;if(!t)return;const age=t.closest('.age-option');if(age){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();showToast();return}const trigger=t.closest('.hero-invite .phone-cta,.hero-invite .js-affiliate,.profile-preview-cta');if(!trigger)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();openQuiz(frame.contentDocument)};
const arm=()=>{try{const win=frame.contentWindow,doc=frame.contentDocument;if(!win||!doc)return false;if(armedWin===win)return true;if(armedWin)armedWin.removeEventListener('click',handler,true);armedWin=win;win.addEventListener('click',handler,true);syncProfile(doc);return true}catch(_){return false}};
frame.addEventListener('load',()=>{arm();setTimeout(arm,50);setTimeout(arm,300)});arm();setTimeout(arm,0);setTimeout(arm,150);setTimeout(arm,700);setTimeout(arm,1500);
close.onclick=closeQuiz;overlay.onclick=e=>{if(e.target===overlay)closeQuiz()};window.addEventListener('keydown',e=>{if(e.key==='Escape')closeQuiz()});
})();
</script>
</body>
</html>
