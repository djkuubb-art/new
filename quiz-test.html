    sl:{k:'UJEMANJE PROFILA',picked:'izbrani profil',q1:'Kaj trenutno iščeš?',q1s:'Izberi odgovor, ki ti je najbližje.',a1:['Sproščen pogovor','Malo spogledovanja','Nekaj resnejšega'],q2:'Kaj te pri ženski najbolj pritegne?',q2s:'Še eno kratko vprašanje, preden preverimo profil.',a2:['Toplina in naravnost','Samozavest','Smisel za humor'],anal:'Preverjamo profil osebe {name}…',analS:'Primerjamo tvoje odgovore z informacijami na njenem profilu.',lines:['Profil in opis','Tvoji odgovori','Možne skupne točke'],result:'To je videti obetavno',resultS:'Glede na tvoje odgovore je profil osebe {name} vreden podrobnejšega ogleda. Lahko nadaljuješ na zadnji korak in ji odgovoriš.',summary:'Tvoji izbiri: {one} · {two}',next:'Na zadnji korak',close:'Zapri',toast:'TEST: tukaj bi izbira starosti odprla ustrezno ciljno stran.'},
    sk:{k:'ZHODA PROFILU',picked:'vybraný profil',q1:'Čo práve hľadáš?',q1s:'Vyber odpoveď, ktorá ti sedí najviac.',a1:['Nezáväzný rozhovor','Trochu flirtu','Niečo vážnejšie'],q2:'Čo ťa na žene priťahuje najviac?',q2s:'Ešte jedna krátka otázka pred kontrolou profilu.',a2:['Srdečnosť a prirodzenosť','Sebavedomie','Zmysel pre humor'],anal:'Kontrolujeme profil {name}…',analS:'Porovnávame tvoje odpovede s informáciami v jej profile.',lines:['Profil a opis','Tvoje odpovede','Možné spoločné body'],result:'Vyzerá to sľubne',resultS:'Podľa tvojich odpovedí stojí profil {name} za bližšie pozretie. Môžeš prejsť na posledný krok a odpísať jej.',summary:'Tvoje voľby: {one} · {two}',next:'Prejsť na posledný krok',close:'Zavrieť',toast:'TEST: tu by výber veku otvoril správny cieľ.'},
    cs:{k:'SHODA PROFILU',picked:'vybraný profil',q1:'Co právě hledáš?',q1s:'Vyber odpověď, která ti sedí nejvíc.',a1:['Nezávaznou konverzaci','Trochu flirtu','Něco vážnějšího'],q2:'Co tě na ženě přitahuje nejvíc?',q2s:'Ještě jedna krátká otázka před kontrolou profilu.',a2:['Vřelost a přirozenost','Sebevědomí','Smysl pro humor'],anal:'Kontrolujeme profil {name}…',analS:'Porovnáváme tvoje odpovědi s informacemi v jejím profilu.',lines:['Profil a popis','Tvoje odpovědi','Možné společné body'],result:'Vypadá to slibně',resultS:'Podle tvých odpovědí stojí profil {name} za bližší prozkoumání. Můžeš přejít k poslednímu kroku a odepsat jí.',summary:'Tvoje volby: {one} · {two}',next:'Přejít k poslednímu kroku',close:'Zavřít',toast:'TEST: zde by volba věku otevřela správný cíl.'},

    he:{k:'התאמת פרופיל',picked:'הפרופיל שנבחר',q1:'מה אתה מחפש כרגע?',q1s:'בחר את התשובה שהכי מתאימה לך.',a1:['שיחה קלילה','קצת פלירטוט','משהו רציני יותר'],q2:'מה הכי מושך אותך באישה?',q2s:'עוד שאלה קצרה אחת לפני שנבדוק את הפרופיל.',a2:['חום וטבעיות','ביטחון עצמי','חוש הומור'],anal:'בודקים את הפרופיל של {name}…',analS:'משווים את התשובות שלך למידע שמופיע בפרופיל שלה.',lines:['הפרופיל והתיאור','התשובות שלך','נקודות חיבור אפשריות'],result:'זה נראה מבטיח',resultS:'לפי התשובות שלך, שווה להכיר טוב יותר את הפרופיל של {name}. אפשר לעבור לשלב האחרון ולהשיב לה.',summary:'הבחירות שלך: {one} · {two}',next:'מעבר לשלב האחרון',close:'סגירה',toast:'TEST: כאן בחירת הגיל הייתה מפעילה את היעד המתאים.'}
  };

  const norm = (v='') => { const s=String(v).replace('_','-'); if(C[s]) return s; const l=s.toLowerCase(); if(l.startsWith('en-us')) return 'en-US'; if(l.startsWith('en-sg')) return 'en-SG'; if(l.startsWith('en')) return 'en-GB'; const sh=l.split('-')[0]; return C[sh] ? sh : 'en-GB'; };
  const t = () => C[locale] || C['en-GB'];
  const f = (s) => String(s||'').replaceAll('{name}',profileName).replaceAll('{one}',selections[0]||'').replaceAll('{two}',selections[1]||'');

  function setStep(n){ progress.forEach((el,i)=>el.classList.toggle('is-on',i<n)); }
  function syncLocale(doc){ locale=norm(doc.getElementById('languageSelect')?.value || doc.documentElement.lang || 'en-GB'); document.documentElement.dir=locale==='he'?'rtl':'ltr'; const x=t(); kicker.textContent=x.k; profileLabel.textContent=x.picked; closeButton.setAttribute('aria-label',x.close); }
  function syncProfile(doc){ const h=doc.querySelector('.hero-invite .featured-profile h2')?.textContent?.trim() || 'Anna, 41'; profileTitle=h; profileName=h.split(',')[0].trim() || 'Anna'; nameNode.textContent=h; const img=doc.querySelector('.hero-invite .featured-profile > img'); avatar.src=img?.currentSrc || img?.src || ''; avatar.alt=profileName; }
  function openQuiz(doc){ syncLocale(doc); syncProfile(doc); selections=[]; renderQuestion(1); overlay.classList.add('is-open'); overlay.setAttribute('aria-hidden','false'); }
  function closeQuiz(){ overlay.classList.remove('is-open'); overlay.setAttribute('aria-hidden','true'); }

  function optionButton(label,index){ return `<button class="quiz-option" type="button" data-index="${index}"><span>${label}</span><span class="arrow" aria-hidden="true">→</span></button>`; }
  function renderQuestion(step){ const x=t(); setStep(step); const q=step===1?x.q1:x.q2; const sub=step===1?x.q1s:x.q2s; const opts=step===1?x.a1:x.a2; body.innerHTML=`<h2 class="quiz-title" id="quizTitle">${q}</h2><p class="quiz-sub">${sub}</p><div class="quiz-options">${opts.map(optionButton).join('')}</div>`; body.querySelectorAll('.quiz-option').forEach(btn=>btn.addEventListener('click',()=>{ const idx=Number(btn.dataset.index)||0; selections[step-1]=opts[idx]; if(step===1){setTimeout(()=>renderQuestion(2),110)}else{setTimeout(renderAnalysis,110)} })); }
  function renderAnalysis(){ const x=t(); setStep(3); body.innerHTML=`<div class="analysis-box"><div><div class="spinner"></div><h2 class="quiz-title">${f(x.anal)}</h2><p class="quiz-sub">${x.analS}</p><div class="analysis-lines">${x.lines.map(v=>`<div class="analysis-line"><i>✓</i><span>${v}</span></div>`).join('')}</div></div></div>`; setTimeout(renderResult,1250); }
  function renderResult(){ const x=t(); body.innerHTML=`<div class="result-icon">✓</div><h2 class="quiz-title">${x.result}</h2><p class="quiz-sub">${f(x.resultS)}</p><div class="result-summary">${f(x.summary)}</div><button class="quiz-next" id="quizNext" type="button"><span>${x.next}</span><span aria-hidden="true">→</span></button>`; document.getElementById('quizNext').addEventListener('click',openFinalStep); }
  function openFinalStep(){ closeQuiz(); const doc=frame.contentDocument; const modal=doc?.getElementById('ageGateModal'); if(modal && typeof modal.showModal==='function'){ try{ if(!modal.open) modal.showModal(); }catch(_){ modal.setAttribute('open',''); } } else { const cta=doc?.querySelector('.hero-invite .phone-cta'); cta?.click(); } }
  function showToast(){ clearTimeout(toastTimer); toast.textContent=t().toast; toast.classList.add('is-on'); toastTimer=setTimeout(()=>toast.classList.remove('is-on'),2400); }

  closeButton.addEventListener('click',closeQuiz);
  overlay.addEventListener('click',e=>{ if(e.target===overlay) closeQuiz(); });
  window.addEventListener('keydown',e=>{ if(e.key==='Escape' && overlay.classList.contains('is-open')) closeQuiz(); });

  frame.addEventListener('load',()=>{
    const win=frame.contentWindow, doc=frame.contentDocument; if(!win||!doc) return;
    syncLocale(doc); syncProfile(doc);
    win.addEventListener('click',(e)=>{
      const target=e.target instanceof Element?e.target:null; if(!target) return;
      const age=target.closest('.age-option');
      if(age){ e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); showToast(); return; }
      const cta=target.closest('.hero-invite .js-affiliate, .profile-preview-cta');
      if(!cta) return;
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); openQuiz(doc);
    },true);
    doc.getElementById('languageSelect')?.addEventListener('change',()=>{ setTimeout(()=>{syncLocale(doc);syncProfile(doc)},30); });
  });
})();
</script>
